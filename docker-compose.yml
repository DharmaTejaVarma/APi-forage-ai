version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apiforge_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/apiforge.db
      - OLLAMA_URL=http://host.docker.internal:11434
      - CHAT_MODEL=qwen2.5:7b-instruct
      - EMBED_MODEL=nomic-embed-text
      - JWT_SECRET=apiforge-super-secret-jwt-key-change-in-production-min-32-chars
      - FERNET_KEY=J6Q20w8l6l_vG2g7yXJ1T-0t0lY9L8A2k8g7h5d4s3E=
      - DEBUG=True
      - DEV_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal
    volumes:
      - apiforge_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apiforge_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  apiforge_data:
