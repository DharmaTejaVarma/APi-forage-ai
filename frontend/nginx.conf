server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass http://backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /connections/ {
        proxy_pass http://backend:8000/connections/;
        proxy_set_header Host $host;
    }

    location /endpoints/ {
        proxy_pass http://backend:8000/endpoints/;
        proxy_set_header Host $host;
    }

    location /workflows/ {
        proxy_pass http://backend:8000/workflows/;
        proxy_set_header Host $host;
    }

    location /executions/ {
        proxy_pass http://backend:8000/executions/;
        proxy_set_header Host $host;
    }

    location /dashboard/ {
        proxy_pass http://backend:8000/dashboard/;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location /mock/ {
        proxy_pass http://backend:8000/mock/;
        proxy_set_header Host $host;
    }
}
